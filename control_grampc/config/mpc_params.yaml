# MPC Control Parameters

# Path following
path_file: "/home/ammar/ros2_ws/src/global-planning/outputs/map5/traj_race_cl.csv"
control_frequency: 20.0 # Hz
target_velocity: 2.0 # m/s
lookahead_distance: 2.0 # m

# MPC solver parameters
mpc:
  horizon: 20 # Number of prediction steps
  dt: 0.05 # Time step (s)

  # State tracking weights (Q matrix)
  q0: 10.0 # x position tracking weight
  q1: 10.0 # y position tracking weight
  q2: 1.0 # heading tracking weight
  q3: 1.0 # velocity tracking weight

  # Input effort weights (R matrix)
  r0: 0.1 # velocity input effort weight
  r1: 1.0 # steering input effort weight

# Vehicle parameters
vehicle:
  wheelbase: 0.33 # m
  max_steering: 0.4 # rad
  max_velocity: 5.0 # m/s
  min_velocity: 0.0 # m/s

# Safety parameters
safety:
  collision_margin: 0.2 # m
  max_lateral_accel: 4.0 # m/s^2

# Topic names (AutoDRIVE simulator)
topics:
  ips: "/autodrive/f1tenth_1/ips"
  lidar: "/autodrive/f1tenth_1/lidar"
  throttle_cmd: "/autodrive/f1tenth_1/throttle_command"
  steering_cmd: "/autodrive/f1tenth_1/steering_command"
