slam_toolbox:
  ros__parameters:
    # —————— 时钟与模式 ——————
    use_sim_time:       true
    mode:               mapping

    # —————— 关键 TF 配置 ——————
    provide_odom_frame: true         # 发布 map→odom
    map_frame:          map          # 地图坐标系
    odom_frame:         odom         # 里程计坐标系（和桥的 parent 对齐）
    base_frame:         f1tenth_1_odom  # 车辆根坐标系（和桥的 child 对齐）

    # —————— 激光雷达 ——————
    scan_topic:         /autodrive/f1tenth_1/lidar
    throttle_scans:     1            # 扫描频率控制
    scan_queue_size:    50

    # —————— 地图调参（可选） ——————
    resolution:         0.05
    max_laser_range:    10.0
    map_update_interval: 1.0

    # —————— 回环（可选） ——————
    do_loop_closing:          true
    loop_search_maximum_distance: 3.0

    # —————— 日志等级 ——————
    debug_logging:      false


