hector_mapping:
  ros__parameters:
    base_frame: "f1tenth_1"
    odom_frame: "f1tenth_1_odom"
    map_frame: "map"
    pub_map_odom_transform: true
    use_tf_scan_transformation: true

    map_resolution: 0.05        # 5cm
    map_size: 1024
    map_start_x: 0.5
    map_start_y: 0.5
    map_multi_res_levels: 3
    update_factor_free: 0.4
    update_factor_occupied: 0.7
    map_update_distance_thresh: 0.2
    map_update_angle_thresh: 0.06

    laser_min_dist: 0.12
    laser_max_dist: 9.0